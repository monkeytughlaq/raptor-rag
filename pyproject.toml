[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-rag-tds"
version = "1.0.0"
description = "RAPTOR-RAG TDS Expert Chatbot with Advanced OCR and Hierarchical Vector Search"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "RAG",
    "RAPTOR",
    "TDS",
    "chatbot",
    "OCR",
    "NLP",
    "tax-compliance",
    "vector-search"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core frameworks
    "streamlit>=1.28.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.20",
    "langchain-huggingface>=0.0.1",
    "langchain-core>=0.1.0",
    
    # Azure OpenAI
    "openai>=1.0.0",
    
    # Vector stores
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.18",
    
    # Embeddings
    "sentence-transformers>=2.2.0",
    "transformers>=4.35.0",
    
    # Document processing
    "PyMuPDF>=1.23.0",  # fitz
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    
    # OCR and image processing
    "opencv-python>=4.8.0",
    
    # ML/AI libraries
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.4",
    
    # Database & ORM (NEW)
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",  # PostgreSQL driver
    
    # Authentication (NEW)
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    
    # Analytics & Visualization (NEW)
    "plotly>=5.17.0",
    "scipy>=1.11.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
]

gpu = [
    "faiss-gpu>=1.7.4",
]

[project.urls]
Homepage = "https://github.com/monkeytughlaq/RAG-notebooklm"
Repository = "https://github.com/monkeytughlaq/RAG-notebooklm"
Issues = "https://github.com/monkeytughlaq/RAG-notebooklm/issues"

[project.scripts]
raptor-ingest = "unified_rag_pipeline:main"
raptor-app = "tds_app1:main"

[tool.setuptools]
packages.find = {where = ["."], exclude = ["tests*", "venv*", "__pycache__*", "*.egg-info*"]}

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
  | embeddings
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=html --cov-report=term-missing"
